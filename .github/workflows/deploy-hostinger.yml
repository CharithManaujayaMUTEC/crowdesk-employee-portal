
name: Deploy Crow Desk Employee Portal

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crowdesk-employee-portal-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to Hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure Next.js Static Export
        run: |
          set -euo pipefail

          cat > next.config.ts <<'CONFIG'
          import type { NextConfig } from "next";

          const nextConfig: NextConfig = {
            output: "export",
            trailingSlash: true,
            poweredByHeader: false,
            reactStrictMode: true,
          };

          export default nextConfig;
          CONFIG

      - name: Configure Static Website Security Headers
        run: |
          set -euo pipefail

          mkdir -p public

          cat > public/.htaccess <<'HTACCESS'
          Options -Indexes
          DirectoryIndex index.html

          <IfModule mod_headers.c>
            Header always set X-Content-Type-Options "nosniff"
            Header always set X-Frame-Options "DENY"
            Header always set Referrer-Policy "strict-origin-when-cross-origin"
            Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
            Header always set Cross-Origin-Opener-Policy "same-origin"
            Header always set Strict-Transport-Security "max-age=31536000"
            Header always set Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'self' https://crowdesk.crowdemo.com; upgrade-insecure-requests"
          </IfModule>
          HTACCESS

      - name: Install NPM Dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript Validation
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build Static Production Application
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://crowdesk.crowdemo.com/api/v1
          NEXT_PUBLIC_APP_NAME: Crow Desk
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Verify Static Build
        run: |
          set -euo pipefail

          test -f out/index.html
          test -f out/login/index.html
          test -f out/dashboard/index.html
          test -d out/_next/static

          cp public/.htaccess out/.htaccess
          test -f out/.htaccess

          echo "Static production build verified."

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail

          : "${SSH_PRIVATE_KEY:?Missing SSH_PASSWORD secret}"
          : "${SSH_HOST:?Missing SSH_HOST secret}"
          : "${SSH_USER:?Missing SSH_USER secret}"
          : "${SSH_PORT:?Missing SSH_PORT secret}"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"

          cat > "$HOME/.ssh/config" <<EOF
          Host production
            HostName ${SSH_HOST}
            User ${SSH_USER}
            Port ${SSH_PORT}
            IdentityFile $HOME/.ssh/id_rsa
            IdentitiesOnly yes
            StrictHostKeyChecking no
          EOF

          chmod 600 "$HOME/.ssh/config"

          ssh -F "$HOME/.ssh/config" \
            -o ConnectTimeout=20 \
            production "printf 'SSH connection successful\n'"

      - name: Synchronize Website to Hostinger
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail

          : "${DEPLOY_PATH:?Missing DEPLOY_PATH secret}"

          rsync \
            --archive \
            --compress \
            --delete \
            --exclude=".well-known/" \
            -e "ssh -F $HOME/.ssh/config" \
            out/ \
            "production:${DEPLOY_PATH%/}/"

      - name: Verify Deployed Website
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail

          ssh -F "$HOME/.ssh/config" \
            "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$DEPLOY_PATH"

          test -s index.html
          test -s login/index.html
          test -s dashboard/index.html
          test -d _next/static
          test -s .htaccess

          echo "Crow Desk static website deployed successfully."
          REMOTE